# ==============================================================================
# EDRP – Docker Compose Stack
# Services: backend (FastAPI), frontend (Flask), postgres, redis,
#            celery_worker, celery_beat
#
# Usage:
#   cp .env.example .env   # fill in real values
#   docker-compose up --build
# ==============================================================================

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  edrp_net:
    driver: bridge

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  celery_beat_data:   # persists the beat schedule & PID file across restarts

# ── Services ───────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edrp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - edrp_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Database – points to the postgres service on the internal network
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Auth
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # SMTP
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      # App
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5000}
      PYTHONPATH: /app
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - edrp_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Celery Worker ──────────────────────────────────────────────────────────────
  # NOTE: entrypoint overrides the Dockerfile ENTRYPOINT (entrypoint.sh) so that
  # migrations are NOT run again by the worker (backend already ran them).
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/celery", "-A", "app.celery_app", "worker",
                 "--loglevel=info", "--concurrency=4"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      REDIS_URL: redis://redis:6379/0
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PYTHONPATH: /app
    volumes:
      - uploads_data:/app/uploads
    networks:
      - edrp_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (scheduled escalation jobs) ────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/celery", "-A", "app.celery_app", "beat",
                 "--loglevel=info", "--pidfile=/celery-beat/celerybeat.pid",
                 "--schedule=/celery-beat/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      REDIS_URL: redis://redis:6379/0
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PYTHONPATH: /app
    volumes:
      - uploads_data:/app/uploads
      - celery_beat_data:/celery-beat   # pidfile + schedule DB persisted
    networks:
      - edrp_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Flask Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Flask talks to the backend over the internal Docker network
      BACKEND_URL: http://backend:8000
      FLASK_ENV: ${ENVIRONMENT:-production}
      # Flask session secret – use FLASK_SECRET_KEY from .env
      SECRET_KEY: ${FLASK_SECRET_KEY}
      PYTHONPATH: /app
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    networks:
      - edrp_net
    depends_on:
      backend:
        condition: service_healthy

