# docker-compose.yml
#
# Local/demo orchestration for the full EDRP stack. Secrets (Gemini
# key, Gmail SMTP password, SECRET_KEY, and — outside this stack — a
# real Redis Cloud / Neon URL) come from the gitignored backend/.env
# via env_file, exactly as the non-Docker workflow already uses. The
# `environment:` block below overrides only the handful of values that
# must point at the LOCAL db/redis services instead — env_file values
# win, and standard Compose precedence lets explicit `environment:`
# keys win over the same key loaded from env_file, so nothing here can
# leak the real Neon/Redis Cloud values into these containers.
#
# Nothing in this file is a real credential — the local Postgres
# password below is the same non-secret default already committed in
# backend/.env.example.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edrp_user
      POSTGRES_PASSWORD: edrp_password
      POSTGRES_DB: edrp_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edrp_user -d edrp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    # No volume: rate-limit counters are transient by design (see
    # middleware/rate_limit.py) — losing them on restart is fine and
    # arguably correct, they're supposed to expire anyway.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://edrp_user:edrp_password@db:5432/edrp_db
      DB_SSL_REQUIRE: "false"
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
      FRONTEND_BASE_URL: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls this directly — it must be a host-reachable
        # URL, never a Docker-internal hostname like "http://backend:8000"
        # (the browser cannot resolve Compose's internal DNS).
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
