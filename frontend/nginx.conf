server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file falls through to
    # index.html so client-side routes survive a direct navigation or
    # a browser refresh, rather than nginx 404ing on them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must always be revalidated so a new deploy is
    # picked up on next reload, even though the hashed assets it
    # references are safe to cache aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
