<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Audit Logs | Expert Decision Replay Platform</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Base CSS -->
    <link
        rel="stylesheet"
        href="/static/css/base.css">

    <!-- Dashboard CSS -->
    <link
        rel="stylesheet"
        href="/static/css/dashboard.css">

    <!-- Audit Logs CSS -->
    <link
        rel="stylesheet"
        href="/static/css/audit_logs.css">

</head>

<body>

<div class="dashboard">

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <aside class="sidebar" id="sidebar">

        <div>

            <div class="sidebar-header">

                <div class="logo-box">
                    <i class="bi bi-diagram-3-fill"></i>
                </div>

                <div>
                    <h3>EDRP</h3>
                    <small>Enterprise Suite</small>
                </div>

            </div>


            <ul class="sidebar-menu" id="sidebarMenu">

                <li>
                    <a href="/dashboard-page">
                        <i class="bi bi-grid-fill"></i>
                        Dashboard
                    </a>
                </li>


                <li>
                    <a href="/decision-page">
                        <i class="bi bi-file-earmark-text"></i>
                        Decisions
                    </a>
                </li>


                <li>
                    <a href="/approvals-page">
                        <i class="bi bi-check2-square"></i>
                        Approvals
                    </a>
                </li>


                <li>
                    <a href="/discussion-page">
                        <i class="bi bi-chat-left-text"></i>
                        Discussion
                    </a>
                </li>


                <li>
                    <a href="/knowledge-page">
                        <i class="bi bi-book"></i>
                        Knowledge
                    </a>
                </li>


                <li>
                    <a href="/reports-page">
                        <i class="bi bi-bar-chart-line"></i>
                        Reports
                    </a>
                </li>


                <li class="active">
                    <a href="/audit-logs">
                        <i class="bi bi-journal-text"></i>
                        Audit Logs
                    </a>
                </li>


                <li>
                    <a href="/alternatives-page">
                        <i class="bi bi-diagram-3"></i>
                        Alternative Analysis
                    </a>
                </li>
                <li id="aiAgentMenu">

                    <a href="/ai-agent-page">

                        <i class="bi bi-robot"></i>

                        AI Agent

                    </a>

                </li>

                <li>
                    <a href="/users-page">
                        <i class="bi bi-people-fill"></i>
                        User Management
                    </a>
                </li>


                <li>
                    <a href="/profile-page">
                        <i class="bi bi-person-circle"></i>
                        My Profile
                    </a>
                </li>

            </ul>

        </div>


        <!-- Sidebar Footer -->

        <div class="sidebar-footer">

            <a href="#" id="logoutBtn">
                <i class="bi bi-box-arrow-left"></i>
                Logout
            </a>

        </div>

    </aside>


    <!-- ================================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================================= -->

    <main class="main-content">

        <!-- Topbar -->

        <header class="topbar">

            <div class="d-flex align-items-center">

                <button
                    class="btn btn-light me-3"
                    id="toggleSidebar"
                    type="button">

                    <i class="bi bi-list"></i>

                </button>


                <div>

                    <h2>Audit Logs</h2>

                    <small>
                        Track system activities and user actions.
                    </small>

                </div>

            </div>

        </header>


        <!-- ================================================= -->
        <!-- AUDIT LOG TABLE -->
        <!-- ================================================= -->

        <div class="page-content">

            <div class="container-fluid">

                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>User</th>

                                <th>Role</th>

                                <th>Module</th>

                                <th>Action</th>

                                <th>Description</th>

                                <th>Date</th>

                            </tr>

                        </thead>


                        <tbody id="auditTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Authentication -->

<script src="/static/js/auth.js"></script>


<!-- Audit Logs JS -->

<script src="/static/js/audit_logs.js"></script>


<!-- Sidebar Toggle -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const sidebar =
        document.getElementById("sidebar");

    const toggleButton =
        document.getElementById("toggleSidebar");


    if (sidebar && toggleButton) {

        toggleButton.addEventListener(
            "click",
            function () {

                sidebar.classList.toggle(
                    "collapsed"
                );

            }
        );

    }

});

</script>

</body>

</html>
