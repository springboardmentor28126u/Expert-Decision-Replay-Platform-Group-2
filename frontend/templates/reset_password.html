{% extends "base.html" %}

{% block title %}
Reset Password | Expert Decision Replay Platform
{% endblock %}

{% block css %}
<link rel="stylesheet" href="/static/css/reset_password.css">
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>
                        <i class="bi bi-shield-lock-fill"></i>
                        Reset Password
                    </h3>

                </div>

                <div class="card-body">

                    <form id="resetPasswordForm">

                        <!-- New Password -->

                        <div class="mb-4">

                            <label class="form-label">

                                New Password

                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="newPassword"
                                    class="form-control"
                                    placeholder="Enter New Password"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary togglePassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm New Password"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary togglePassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>

                        <!-- Password Strength -->

                        <div class="mb-4">

                            <label class="form-label">

                                Password Strength

                            </label>

                            <div class="progress">

                                <div
                                    id="passwordStrength"
                                    class="progress-bar"
                                    style="width:0%">

                                    Weak

                                </div>

                            </div>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="/login"
                                class="btn btn-secondary">

                                Back to Login

                            </a>

                            <button
                                type="submit"
                                id="resetPasswordBtn"
                                class="btn btn-success">

                                <i class="bi bi-shield-lock-fill"></i>

                                Reset Password

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block js %}

<script src="/static/js/reset_password.js"></script>

{% endblock %}
